    <text x="0" y="52" font-family="'Cinzel', 'Georgia', serif" font-size="20" font-weight="700" fill="#B30000" letter-spacing="4">
      🛕 SRI KSHETRA
    </text>

    <!-- Main Heading -->
    <text x="0" y="98" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="38" font-weight="800" fill="#800000" letter-spacing="1.5">
      DHARMASTHALA
    </text>

    <!-- Badge Pill Container -->
    <rect x="0" y="122" width="460" height="42" rx="21" fill="url(#goldGradL)" />
    <text x="230" y="149" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#500000" letter-spacing="3" text-anchor="middle">
