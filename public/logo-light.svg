<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="goldGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE259" />
      <stop offset="50%" stop-color="#FFA751" />
      <stop offset="100%" stop-color="#E67E22" />
    </linearGradient>

    <linearGradient id="maroonGradL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#800000" />
      <stop offset="100%" stop-color="#4A0000" />
    </linearGradient>

    <linearGradient id="flameGradL" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF512F" />
      <stop offset="50%" stop-color="#F09819" />
      <stop offset="100%" stop-color="#FFEA82" />
    </linearGradient>
  </defs>

  <!-- Left Emblem Group (X centered at 100, Y at 100) -->
  <g transform="translate(10, 10) scale(0.35)">
